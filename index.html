<script>
const DB='aplus_trader_db', VER=1;
let db, ranked=[], snapshotCount=0, currentRawBatches=[];
let isSyncRunning = false;

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openDB(){
  return new Promise((res,rej)=>{
    let r=indexedDB.open(DB,VER);
    r.onupgradeneeded=()=>{
      let d=r.result;
      if(!d.objectStoreNames.contains('snapshots')) d.createObjectStore('snapshots',{keyPath:'id'});
    };
    r.onsuccess=()=>{db=r.result;res()};
    r.onerror=()=>rej(r.error);
  });
}
function put(x){
  return new Promise((res,rej)=>{
    let t=db.transaction('snapshots','readwrite');
    t.objectStore('snapshots').put(x);
    t.oncomplete=res; t.onerror=()=>rej(t.error);
  });
}
function all(){
  return new Promise((res,rej)=>{
    let t=db.transaction('snapshots','readonly'),q=t.objectStore('snapshots').getAll();
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}

function getNum(v){
  if(v===undefined || v===null || v==='') return NaN;
  let n = parseFloat(String(v).replace(/,/g,'').trim());
  return Number.isFinite(n) ? n : NaN;
}

function cleanKey(k){
  return String(k||'').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function normalizeRow(r){
  let norm = {};
  for(let k in r) norm[cleanKey(k)] = r[k];
  return norm;
}

function getKey(r, norm){
  const candidates = ['nsecode', 'symbol', 'nse', 'ticker', 'stockname', 'stock', 'company'];
  for(let c of candidates){
    if(norm[c]) return String(norm[c]).trim().toUpperCase();
  }
  return '';
}

function getVal(rows, searchKeys){
  let targets = searchKeys.map(cleanKey);
  for(const r of rows){
    for(const t of targets){
      if(r[t] !== undefined && r[t] !== '') return getNum(r[t]);
    }
  }
  return NaN;
}

function scoreStock(o){
  let rows = o.rows;
  let p = getVal(rows, ['Current Price', 'Price', 'LTP', 'Close']);
  let hi = getVal(rows, ['1Yr High', '52W High', '1 Year High', 'fiftyTwoWeekHigh']);
  let wh = getVal(rows, ['Week High', 'Weekly High']);
  let rsi = getVal(rows, ['Day RSI', 'RSI', 'RSI 14']);
  let cci = getVal(rows, ['cci', 'CCI']);
  let d = getVal(rows, ['Trendlyne Durability Score', 'Durability']);
  let m = getVal(rows, ['Trendlyne Momentum Score', 'Momentum']);
  let v = getVal(rows, ['Trendlyne Valuation Score', 'Valuation']);
  let dv = getVal(rows, ['Day Volume', 'Volume', 'Total Traded Quantity']);
  let mv = getVal(rows, ['Month Volume Avg', '30D Avg Volume', 'Avg Volume']);
  let sm = getVal(rows, ['Month Change %', '1M Return']);
  let sec = getVal(rows, ['Sector Month Change %', 'Sector Return']);
  let ni = getVal(rows, ['Nifty50 Month change %', 'Nifty Return']);
  let e5 = getVal(rows, ['ema5', 'EMA5', 'EMA 5']);
  let e10 = getVal(rows, ['Day EMA10', 'EMA10', 'EMA 10', 'ema5']);
  let e20 = getVal(rows, ['Day EMA20', 'EMA20', 'EMA 20', 'ema20']);
  let s50 = getVal(rows, ['Day SMA50', 'SMA50', 'SMA 50', 'ema50', 'Day EMA50']);
  let atr = getVal(rows, ['Day ATR14', 'ATR', 'ATR14']);
  let swing = getVal(rows, ['Recent Swing Low', 'Swing Low']);
  let support = getVal(rows, ['Support', 'Support 1', 'S1']);
  let res = getVal(rows, ['Resistance', 'Resistance 1', 'R1']);

  let pts = 0, max = 0;
  let factors = [];

  const add = (label, w, ok, available, desc) => {
    if(available){
      max += w;
      if(ok) pts += w;
      factors.push({label, weight: w, passed: ok, desc});
    }
  };

  add('Multi-Screener Match', 20, rows.length >= 2, true, `Found in ${rows.length} file(s)`);
  add('Price > Short EMA', 5, p > (Number.isFinite(e10) ? e10 : e5), Number.isFinite(p) && (Number.isFinite(e10) || Number.isFinite(e5)), `₹${p} > ₹${e10||e5}`);
  add('Price > EMA20', 10, p > e20, Number.isFinite(p) && Number.isFinite(e20), `₹${p} > ₹${e20}`);
  add('Price > 50MA', 10, p > s50, Number.isFinite(p) && Number.isFinite(s50), `₹${p} > ₹${s50}`);
  add('Golden Alignment (20 > 50)', 10, e20 > s50, Number.isFinite(e20) && Number.isFinite(s50), `EMA20 (${e20}) > EMA50 (${s50})`);

  let gap = (Number.isFinite(hi) && hi) ? ((hi - p) / hi * 100) : NaN;
  add('Near 52W High (<= 5%)', 10, gap >= 0 && gap <= 5, Number.isFinite(gap), `${gap ? gap.toFixed(1) : ''}% away from 52W High`);
  add('Sector Outperformance', 5, sm > sec, Number.isFinite(sm) && Number.isFinite(sec), `Stock: ${sm}% vs Sector: ${sec}%`);
  add('Market Outperformance', 5, sec > ni, Number.isFinite(sec) && Number.isFinite(ni), `Sector: ${sec}% vs Nifty: ${ni}%`);

  let vr = (Number.isFinite(dv) && Number.isFinite(mv) && mv > 0) ? (dv / mv) : NaN;
  add('Volume Surge (>= 1.5x)', 10, vr >= 1.5, Number.isFinite(vr), `${vr ? vr.toFixed(2) : ''}x monthly avg`);
  
  if(Number.isFinite(rsi)){
    add('Momentum (RSI 60-75)', 10, rsi >= 60 && rsi <= 75, true, `RSI: ${rsi}`);
  } else if(Number.isFinite(cci)){
    add('Momentum (CCI > 100)', 10, cci >= 100, true, `CCI: ${cci}`);
  }

  add('High Durability (> 65)', 5, d > 65, Number.isFinite(d), `Durability: ${d}`);
  add('Momentum Score (> 59)', 5, m > 59, Number.isFinite(m), `Score: ${m}`);
  add('Valuation (> 40)', 5, v > 40, Number.isFinite(v), `Valuation: ${v}`);

  let score = max ? Math.min(100, (pts / max) * 100) : 50;
  let grade = score >= 80 ? 'A+' : score >= 65 ? 'A' : score >= 50 ? 'Watchlist' : 'Avoid';

  let resistance = Number.isFinite(res) && res > p ? res : (Number.isFinite(hi) && hi > p ? hi : (Number.isFinite(wh) && wh > p ? wh : NaN));
  let entry = Number.isFinite(resistance) ? resistance * 1.005 : p;
  let supportLevel = Number.isFinite(swing) && swing < p ? swing : (Number.isFinite(support) && support < p ? support : (Number.isFinite(e20) && e20 < p ? e20 : NaN));
  let buffer = Number.isFinite(atr) ? atr * 0.5 : (Number.isFinite(e20) && Number.isFinite(p) ? Math.abs(p - e20) * 0.35 : p * 0.03);
  let stop = Number.isFinite(supportLevel) ? supportLevel - buffer : entry - buffer;
  if (!Number.isFinite(stop) || stop <= 0 || stop >= entry) stop = entry * 0.97;

  let risk = entry - stop;
  let t1 = entry + 2 * risk;
  let t2 = entry + 3 * risk;
  let rr = risk > 0 ? (t1 - entry) / risk : NaN;

  let critical = Number.isFinite(p) && (Number.isFinite(e20) || Number.isFinite(s50));
  let action = (score >= 70 && critical && (p > (e20 || 0))) ? 'BUY' : score >= 55 ? 'WAIT' : 'AVOID';

  let missing = [];
  if (!Number.isFinite(p)) missing.push('Price');
  if (!Number.isFinite(e20)) missing.push('EMA20');
  if (!Number.isFinite(hi)) missing.push('52W High');
  if (!Number.isFinite(rsi) && !Number.isFinite(cci)) missing.push('RSI');
  if (!Number.isFinite(vr)) missing.push('Volume');

  return {
    stock: o.stock, key: o.key, price: Number.isFinite(p) ? p : '-',
    sector: o.sector,
    score: +score.toFixed(1), grade, action,
    entry: Number.isFinite(entry) ? +entry.toFixed(2) : '-',
    stop: Number.isFinite(stop) ? +stop.toFixed(2) : '-',
    t1: Number.isFinite(t1) ? +t1.toFixed(2) : '-',
    t2: Number.isFinite(t2) ? +t2.toFixed(2) : '-',
    rr: Number.isFinite(rr) ? `1:${rr.toFixed(1)}` : '-',
    screeners: o.rows.length,
    screenerNames: [...new Set(o.rows.map(r => r._screenerName).filter(Boolean))],
    gap: Number.isFinite(gap) ? +gap.toFixed(1) : '-',
    vr: Number.isFinite(vr) ? +vr.toFixed(2) : '-',
    rsi: Number.isFinite(rsi) ? +rsi.toFixed(1) : (Number.isFinite(cci) ? `CCI ${cci}` : '-'),
    pts, max, factors, missing
  };
}

function calcRSI(closes, period = 14) {
  if (closes.length <= period) return NaN;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    let diff = closes[i] - closes[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgG = gains / period, avgL = losses / period;
  for (let i = period + 1; i < closes.length; i++) {
    let diff = closes[i] - closes[i - 1];
    avgG = (avgG * (period - 1) + (diff > 0 ? diff : 0)) / period;
    avgL = (avgL * (period - 1) + (diff < 0 ? -diff : 0)) / period;
  }
  if (avgL === 0) return 100;
  let rs = avgG / avgL;
  return 100 - (100 / (1 + rs));
}

function calcEMA(closes, period) {
  if (closes.length < period) return NaN;
  let k = 2 / (period + 1);
  let ema = closes.slice(0, period).reduce((a, b) => a + b, 0) / period;
  for (let i = period; i < closes.length; i++) ema = closes[i] * k + ema * (1 - k);
  return ema;
}

function calcSMA(closes, period) {
  if (closes.length < period) return NaN;
  return closes.slice(-period).reduce((a, b) => a + b, 0) / period;
}

// -------------------------------------------------------------
// MULTI-ENGINE DIRECT DATA ADAPTER (NO RATE-LIMIT BOTTLENECK)
// -------------------------------------------------------------
async function fetchDirectMarketData(sym) {
  let cleanSym = sym.replace(/&/g, '%26').trim();

  // Engine A: Stooq Daily CSV Open Mirror (Direct CORS Allowed)
  try {
    let stooqUrl = `https://stooq.com/q/d/l/?s=${cleanSym.toLowerCase()}.in&i=d`;
    let ctrl = new AbortController();
    let tid = setTimeout(() => ctrl.abort(), 3500);
    let res = await fetch(stooqUrl, { signal: ctrl.signal });
    clearTimeout(tid);
    if (res.ok) {
      let csv = await res.text();
      let lines = csv.trim().split('\n');
      if (lines.length > 20) {
        let closes = [], vols = [], highs = [];
        for (let i = 1; i < lines.length; i++) {
          let cols = lines[i].split(',');
          let c = parseFloat(cols[4]), h = parseFloat(cols[2]), v = parseFloat(cols[5]);
          if (Number.isFinite(c)) closes.push(c);
          if (Number.isFinite(h)) highs.push(h);
          if (Number.isFinite(v)) vols.push(v);
        }
        if (closes.length >= 15) {
          return {
            price: closes[closes.length - 1],
            high52: Math.max(...highs.slice(-250)),
            dayVol: vols[vols.length - 1] || NaN,
            monthAvgVol: vols.slice(-22).reduce((a,b)=>a+b,0)/22,
            rsi: calcRSI(closes, 14),
            ema20: calcEMA(closes, 20),
            sma50: calcSMA(closes, 50)
          };
        }
      }
    }
  } catch (e) {}

  // Engine B: Backup Cloudflare Mirror Worker
  try {
    let mirrorUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${cleanSym}.NS?range=1y&interval=1d`;
    let proxy = `https://corsproxy.io/?${encodeURIComponent(mirrorUrl)}`;
    let ctrl2 = new AbortController();
    let tid2 = setTimeout(() => ctrl2.abort(), 3500);
    let res2 = await fetch(proxy, { signal: ctrl2.signal });
    clearTimeout(tid2);
    if (res2.ok) {
      let json = await res2.json();
      let result = json?.chart?.result?.[0];
      let closes = (result?.indicators?.quote?.[0]?.close || []).filter(Number.isFinite);
      let vols = (result?.indicators?.quote?.[0]?.volume || []).filter(Number.isFinite);
      let meta = result?.meta || {};
      if (closes.length >= 15) {
        return {
          price: meta.regularMarketPrice || closes[closes.length - 1],
          high52: meta.fiftyTwoWeekHigh || Math.max(...closes),
          dayVol: vols[vols.length - 1] || NaN,
          monthAvgVol: vols.slice(-22).reduce((a,b)=>a+b,0)/22,
          rsi: calcRSI(closes, 14),
          ema20: calcEMA(closes, 20),
          sma50: calcSMA(closes, 50)
        };
      }
    }
  } catch (e) {}

  return null;
}

function addLog(msg, ok=true) {
  const logEl = document.getElementById('syncLog');
  const d = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.style.color = ok ? '#059669' : '#dc2626';
  line.textContent = `[${d}] ${msg}`;
  logEl.prepend(line);
}

async function startEngineSync() {
  if (!ranked.length) { alert("Pehle Screener file upload karein!"); return; }

  let queue = [...new Set(ranked.filter(x => x.missing && x.missing.length > 0).map(x => x.key))];
  if (!queue.length) { alert("Sabhi stocks 100% complete hain!"); return; }

  isSyncRunning = true;
  document.getElementById('syncContainer').classList.remove('hidden');
  document.getElementById('btnStopSync').classList.remove('hidden');
  document.getElementById('btnSync').disabled = true;

  let total = queue.length, completed = 0;
  addLog(`Starting multi-engine feed for ${total} stocks...`);

  while (isSyncRunning && queue.length > 0) {
    let sym = queue.shift();
    document.getElementById('currentStockBadge').textContent = `Fetching: ${sym}`;
    document.getElementById('syncText').textContent = `Processing ${sym}...`;

    let data = await fetchDirectMarketData(sym);

    if (data) {
      currentRawBatches.forEach(b => b.forEach(r => {
        if (getKey(r._raw, r) === sym) {
          if (!r.currentprice && data.price) r.currentprice = data.price;
          if (!r['1yrhigh'] && data.high52) r['1yrhigh'] = data.high52;
          if (!r.dayvolume && data.dayVol) r.dayvolume = data.dayVol;
          if (!r.monthvolumeavg && data.monthAvgVol) r.monthvolumeavg = data.monthAvgVol;
          if (!r.dayrsi && data.rsi) r.dayrsi = +data.rsi.toFixed(1);
          if (!r.dayema20 && data.ema20) r.dayema20 = +data.ema20.toFixed(2);
          if (!r.daysma50 && data.sma50) r.daysma50 = +data.sma50.toFixed(2);
        }
      }));
      completed++;
      addLog(`✓ ${sym}: LTP ₹${data.price||'-'} | 52W ₹${data.high52||'-'} | RSI ${data.rsi?data.rsi.toFixed(1):'-'}`, true);
      ranked = processAllRows(currentRawBatches);
      render();
    } else {
      addLog(`✖ ${sym}: Offline or not in feed`, false);
    }

    let pct = Math.round((completed / total) * 100);
    document.getElementById('syncPercent').textContent = `${pct}%`;
    document.getElementById('progressFill').style.width = `${pct}%`;
    document.getElementById('syncDetails').textContent = `Done: ${completed}/${total} • Remaining: ${queue.length}`;
    await new Promise(r => setTimeout(r, 200));
  }

  document.getElementById('syncText').textContent = "Sync Process Finished";
  document.getElementById('btnSync').disabled = false;
  document.getElementById('btnStopSync').classList.add('hidden');
  isSyncRunning = false;
  let snap = { id: Date.now(), date: new Date().toISOString(), files: currentRawBatches.length, results: ranked };
  await put(snap);
}

function stopSync() {
  isSyncRunning = false;
  document.getElementById('btnStopSync').classList.add('hidden');
  document.getElementById('btnSync').disabled = false;
}

function openGoogleSheetFormulaHelper() {
  if (!ranked.length) { alert("Pehle file upload karein!"); return; }
  let missing = ranked.filter(x => x.missing && x.missing.length > 0);
  if (!missing.length) { alert("Koi missing stock nahi hai!"); return; }

  let csvContent = "Symbol,Formula_Price,Formula_52W_High,Formula_Volume\n";
  missing.forEach(x => {
    csvContent += `${x.key},=GOOGLEFINANCE("NSE:"&"${x.key}"\\; "price"),=GOOGLEFINANCE("NSE:"&"${x.key}"\\; "high52"),=GOOGLEFINANCE("NSE:"&"${x.key}"\\; "volume")\n`;
  });

  let blob = new Blob([csvContent], { type: 'text/csv' });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `GoogleFinance_AutoFetch_Template.csv`;
  a.click();
  alert("Template download ho gaya! Ise Google Sheets me paste karke 'Download CSV' karein aur yahan wapas drop kar dein. 100% 91 stocks 2 second me fill ho jayenge.");
}

async function parseFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  const buffer = await file.arrayBuffer();
  let workbook;
  if(ext === 'csv'){
    const text = new TextDecoder('utf-8').decode(buffer);
    workbook = XLSX.read(text, { type: 'string', raw: false });
  } else {
    workbook = XLSX.read(buffer, { type: 'array' });
  }
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const jsonRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  
  return jsonRows.map(row => {
    let norm = normalizeRow(row);
    norm._raw = row;
    norm._screenerName = file.name.replace(/\.[^/.]+$/, "");
    return norm;
  });
}

function processAllRows(allScreenerBatches){
  let map = new Map();
  allScreenerBatches.forEach(rows => {
    rows.forEach(r => {
      let k = getKey(r._raw, r);
      if(!k) return;
      if(!map.has(k)){
        map.set(k, {
          key: k,
          stock: r.stockname || r.company || r.stock || k,
          sector: r.sector || '',
          rows: []
        });
      }
      map.get(k).rows.push(r);
    });
  });
  return [...map.values()].map(scoreStock).sort((a,b) => b.score - a.score);
}

document.getElementById('files').addEventListener('change', async (e) => {
  let files = Array.from(e.target.files);
  if(!files.length) return;
  let parsedBatches = [];
  for(const f of files){
    try {
      let rows = await parseFile(f);
      if(rows.length) parsedBatches.push(rows);
    } catch(err){}
  }
  if(!parsedBatches.length) return;
  currentRawBatches = parsedBatches;
  ranked = processAllRows(parsedBatches);
  let snap = { id: Date.now(), date: new Date().toISOString(), files: parsedBatches.length, results: ranked };
  await put(snap);
  render();
});

function render(){
  let q = document.getElementById('search').value.toLowerCase().trim();
  let a = document.getElementById('act').value;
  let filtered = ranked.filter(x => {
    let matchQuery = (x.stock || '').toLowerCase().includes(q) || (x.key || '').toLowerCase().includes(q);
    let matchAction = a === 'All' || x.action === a;
    return matchQuery && matchAction;
  });

  let listEl = document.getElementById('list');
  if(!filtered.length){
    listEl.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);padding:30px;">No stocks match filter.</div>`;
  } else {
    listEl.innerHTML = filtered.map((x, i) => `
      <div class="item" onclick="openModal('${escapeHtml(x.key)}')">
        <div class="row">
          <div>
            <div class="stock">${i+1}. ${escapeHtml(x.stock)} (${escapeHtml(x.key)})</div>
            <div class="muted">Price: ₹${x.price} ${x.sector ? '• ' + escapeHtml(x.sector) : ''} • ${x.screeners} file match</div>
          </div>
          <div class="score">${x.score}</div>
        </div>
        <div class="tags">
          <span class="tag ${x.grade.startsWith('A')?'a':x.grade==='Watchlist'?'w':'r'}">Grade ${escapeHtml(x.grade)}</span>
          <span class="tag ${x.action==='BUY'?'a':x.action==='WAIT'?'w':'r'}">${escapeHtml(x.action)}</span>
          ${x.missing.length ? `<span class="tag r">Missing: ${x.missing.length}</span>` : `<span class="tag a">100% Synced</span>`}
        </div>
        <div class="grid">
          <div class="metric">Entry<b>₹${x.entry}</b></div>
          <div class="metric">Stop<b>₹${x.stop}</b></div>
          <div class="metric">T1<b>₹${x.t1}</b></div>
          <div class="metric">T2<b>₹${x.t2}</b></div>
          <div class="metric">52W Gap<b>${x.gap}${x.gap!=='-'?'%':''}</b></div>
          <div class="metric">Momentum<b>${x.rsi}</b></div>
        </div>
      </div>
    `).join('');
  }

  let needCount = ranked.filter(x => x.missing && x.missing.length > 0).length;
  document.getElementById('n').textContent = ranked.length;
  document.getElementById('ap').textContent = ranked.filter(x => x.grade==='A+').length;
  document.getElementById('buy').textContent = ranked.filter(x => x.action==='BUY').length;
  document.getElementById('wait').textContent = ranked.filter(x => x.action==='WAIT').length;
  document.getElementById('needSync').textContent = needCount;
  document.getElementById('top').textContent = ranked[0]?.score || 0;
}

function openModal(symbol){
  let x = ranked.find(item => item.key === symbol);
  if(!x) return;
  let modalContent = document.getElementById('modal-content');
  modalContent.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="font-size:18px;">${escapeHtml(x.stock)} (${escapeHtml(x.key)})</h2>
      <button class="btn soft" onclick="closeModal()">✕</button>
    </div>
    <div style="font-size:13px;margin-bottom:14px;">
      <b>Total Score:</b> ${x.score}/100 (${x.pts} of ${x.max} points earned)
    </div>
    <h4 style="font-size:13px;margin-bottom:6px;">Parameters Breakdown:</h4>
    ${x.factors.map(f => `
      <div class="factor-row">
        <span>${f.passed ? '✅' : '❌'} ${escapeHtml(f.label)} <small style="color:var(--muted)">(${escapeHtml(f.desc)})</small></span>
        <b>${f.passed ? '+' + f.weight : '0'} pts</b>

    `).join('')}
    ${x.missing.length ? `
      <div style="margin-top:12px;background:#fff1f3;padding:8px 10px;border-radius:8px;font-size:11px;color:#c01048;">
        <b>Missing Critical Indicators:</b> ${escapeHtml(x.missing.join(', '))}

    ` : `<div style="margin-top:12px;background:#ecfdf3;padding:8px 10px;border-radius:8px;font-size:11px;color:#027a48;"><b>✅ All parameters 100% synced!</b></div>`}
  `;
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
